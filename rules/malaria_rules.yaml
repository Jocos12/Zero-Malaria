# PLACEHOLDER - TO BE VALIDATED against the Rwanda national malaria treatment
# guidelines and WHO iCCM guidance by a clinician.
#
# ZeroMalaria clinical rules - SINGLE SOURCE OF TRUTH for engines.
# Thresholds are duplicated in clinical_config.yaml for review; keep values in sync.
# Ported to Python (apps/api/engine/rules.py) and TypeScript (apps/web).
# Do NOT invent temperature, respiratory-rate, hemoglobin, or dose thresholds.

meta:
  version: "1.1.0-placeholder"
  synthetic_demo: true
  disclaimer: "Decision support tool. Not a replacement for clinical judgment."
  validation_banner: >-
    PLACEHOLDER - TO BE VALIDATED against the Rwanda national malaria treatment
    guidelines and WHO iCCM guidance by a clinician.
  protocol_reference: "WHO iCCM / Rwanda national malaria community care (PLACEHOLDER)"
  clinical_config: "rules/clinical_config.yaml"

# Decision ranking (higher = more urgent). ML may escalate, never downgrade.
# Public aliases (UI/eval): treat_at_home->treat_locally, refer->monitor, urgent_refer->urgent_referral
decision_rank:
  treat_at_home: 0
  refer: 1
  urgent_refer: 2

# TODO_CLINICAL_REVIEW: confirm exact infant age cutoff (see clinical_config.yaml).
infant_refer_months: 2

# TODO_CLINICAL_REVIEW: confirm persistent-fever follow-up day (see clinical_config.yaml).
persistent_fever_days: 3

danger_signs:
  - id: convulsions
    field: convulsions
    when_true: urgent_refer
    protocol_section: "iCCM danger signs - convulsions / fits" # TODO_CLINICAL_REVIEW
    reason_en: "Convulsions (fits) reported"
    reason_rw: "Gusetsa (fits) byavuzwe" # TODO_REVIEW_RW
  - id: unable_to_drink
    field: unable_to_drink
    when_true: urgent_refer
    protocol_section: "iCCM danger signs - unable to drink or feed" # TODO_CLINICAL_REVIEW
    reason_en: "Unable to drink or feed"
    reason_rw: "Ntashobora kunywa cyangwa kurya" # TODO_REVIEW_RW
  - id: vomiting_everything
    field: vomiting_everything
    when_true: urgent_refer
    protocol_section: "iCCM danger signs - vomiting everything" # TODO_CLINICAL_REVIEW
    reason_en: "Vomiting everything"
    reason_rw: "Araruka byose" # TODO_REVIEW_RW
  - id: lethargy
    field: lethargy
    when_true: urgent_refer
    protocol_section: "iCCM danger signs - lethargy / unconscious" # TODO_CLINICAL_REVIEW
    reason_en: "Lethargy or unconsciousness"
    reason_rw: "Yacitse intege cyangwa ntabona" # TODO_REVIEW_RW
  - id: severe_breathing_difficulty
    field: severe_breathing_difficulty
    when_true: urgent_refer
    protocol_section: "iCCM danger signs - severe breathing difficulty" # TODO_CLINICAL_REVIEW
    reason_en: "Severe breathing difficulty"
    reason_rw: "Agorwa cyane n'uruhuha" # TODO_REVIEW_RW

# Blood and related signs (STEP 3). Stored for handover; escalation off until RBC validates.
blood_related_signs:
  - id: pale_palms_or_eyelids
    field: pale_palms_or_eyelids
    when_true: urgent_refer
    status: pending_clinical_validation
    escalation_enabled: false
    inform_nurse: true
    protocol_section: "Blood-related sign - severe anaemia (PLACEHOLDER)" # TODO_CLINICAL_REVIEW
    reason_en: "Pale palms or very pale inside eyelids reported"
    reason_rw: "Umutwe w'ibiganza cyangwa imbere y'ijisho byera cyane byavuzwe" # TODO_REVIEW_RW
  - id: blood_in_stool
    field: blood_in_stool
    when_true: urgent_refer
    status: pending_clinical_validation
    escalation_enabled: false
    inform_nurse: true
    protocol_section: "Blood-related sign - blood in stool (PLACEHOLDER)" # TODO_CLINICAL_REVIEW
    reason_en: "Blood in stool reported"
    reason_rw: "Amaraso mu nda byavuzwe" # TODO_REVIEW_RW
  - id: dark_or_bloody_urine
    field: dark_or_bloody_urine
    when_true: urgent_refer
    status: pending_clinical_validation
    escalation_enabled: false
    inform_nurse: true
    protocol_section: "Blood-related sign - dark or bloody urine (PLACEHOLDER)" # TODO_CLINICAL_REVIEW
    reason_en: "Dark or bloody urine reported"
    reason_rw: "Inkari yijimye cyangwa ifite amaraso byavuzwe" # TODO_REVIEW_RW
  - id: bleeding_nose_gums_skin_or_vomit_blood
    field: bleeding_nose_gums_skin_or_vomit_blood
    when_true: urgent_refer
    status: pending_clinical_validation
    escalation_enabled: false
    inform_nurse: true
    protocol_section: "Blood-related sign - bleeding (PLACEHOLDER)" # TODO_CLINICAL_REVIEW
    reason_en: "Bleeding from nose, gums, skin, or blood in vomit reported"
    reason_rw: "Kuva amaraso mu zuru, mu kanwa, ku ruhu, cyangwa mu nda byavuzwe" # TODO_REVIEW_RW

blood_optional_fields:
  - id: hemoglobin_g_dl
    field: hemoglobin_g_dl
    status: pending_clinical_validation
    escalation_enabled: false
    protocol_section: "Optional hemoglobin (g/dL) - no automated threshold" # TODO_CLINICAL_REVIEW

rules:
  - id: infant_age_referral
    description: >-
      PLACEHOLDER: sick infants below infant_refer_months are referred urgently
      from community care (common iCCM convention). Not a Rwanda-validated cutoff.
    protocol_section: "iCCM young infant referral" # TODO_CLINICAL_REVIEW
    when:
      age_months_lt: infant_refer_months
    decision: urgent_refer
    reason_en: "Age under {infant_refer_months} months (placeholder young-infant rule)"
    reason_rw: "Imyaka iri munsi ya {infant_refer_months} amezi (amategeko ya placeholder)" # TODO_REVIEW_RW

  - id: invalid_tdr_refer
    description: PLACEHOLDER operational referral for invalid TDR - not a severity grade.
    protocol_section: "RDT invalid / repeat testing" # TODO_CLINICAL_REVIEW
    when:
      tdr_result: invalid
      no_urgent_already: true
    decision: refer
    reason_en: "Invalid TDR - refer for repeat testing / assessment"
    reason_rw: "TDR ntabwo yemewe - ohereze gukorera ikizamini cyangwa gusuzumwa" # TODO_REVIEW_RW

  - id: persistent_fever_negative_tdr
    description: >-
      PLACEHOLDER: common iCCM counseling interval (~day 3) if illness is not
      improving and TDR is negative. Not a severe-malaria threshold.
    protocol_section: "iCCM fever follow-up with negative RDT" # TODO_CLINICAL_REVIEW
    when:
      tdr_result: negative
      fever_days_gte: persistent_fever_days
      no_urgent_already: true
    decision: refer
    reason_en: "Fever for {persistent_fever_days}+ days with negative TDR (placeholder follow-up)"
    reason_rw: "Ubushyuhe bw'iminsi {persistent_fever_days}+ hamwe na TDR mbi (placeholder)" # TODO_REVIEW_RW

  - id: incomplete_assessment
    description: >-
      Fired when required danger-sign answers are missing. Unanswered is never
      treated as No; default home care is withheld.
    protocol_section: "Incomplete community assessment (operational)"
    when:
      missing_danger_signs: true
      no_urgent_already: true
    decision: refer
    reason_en: "Incomplete assessment - danger signs not fully answered"
    reason_rw: "Isuzuma ntiruzuye - ibimenyetso by'akaga ntibyuzuye" # TODO_REVIEW_RW

  - id: default_treat_at_home
    description: >-
      Default when no referral rule fires and assessment is complete. Includes
      uncomplicated TDR-positive fever in this demo. Does NOT prescribe drugs or doses.
    protocol_section: "Uncomplicated malaria community care (PLACEHOLDER)" # TODO_CLINICAL_REVIEW
    when:
      no_referral_already: true
      assessment_complete: true
    decision: treat_at_home
    reason_en: "No placeholder danger sign or referral rule triggered"
    reason_rw: "Nta ikimenyetso cy'akaga cyangwa itegeko ryo kohereza ryabonetse" # TODO_REVIEW_RW

# ML escalation (Layer 2) - may only raise decision_rank, never lower it.
# TODO_CLINICAL_REVIEW: demo thresholds only.
ml_escalation:
  severe_case:
    escalate_treat_to_refer_threshold: 0.35
    escalate_refer_to_urgent_threshold: 0.55
  referral_not_completed:
    high_risk_threshold: 0.45

feature_labels_en:
  age_months: "Age (months)"
  temperature_c: "Temperature"
  fever_days: "Days of fever"
  convulsions: "Convulsions"
  unable_to_drink: "Unable to drink or feed"
  vomiting_everything: "Vomiting everything"
  lethargy: "Lethargy"
  severe_breathing_difficulty: "Severe breathing difficulty"
  pale_palms_or_eyelids: "Pale palms or very pale inside eyelids"
  blood_in_stool: "Blood in stool"
  dark_or_bloody_urine: "Dark or bloody urine"
  bleeding_nose_gums_skin_or_vomit_blood: "Bleeding (nose, gums, skin, or vomit)"
  hemoglobin_g_dl: "Hemoglobin (g/dL)"
  tdr_positive: "TDR positive"
  tdr_negative: "TDR negative"
  tdr_invalid: "TDR invalid"
  sex_female: "Sex female"
